services:
  postgres:
    image: postgres:15
    container_name: postgres_reyvianti
    restart: unless-stopped
    env_file: .env
    ports:
      - "22021:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_reyvianti
    restart: unless-stopped
    env_file: .env
    ports:
      - "44021:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
